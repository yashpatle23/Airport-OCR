[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airport-ocr"
version = "0.3.0"
description = "Portable FastAPI service for non-operational airport-chart extraction and JSON output."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Airport-OCR contributors" }]
keywords = ["aviation", "aerodrome", "chart", "geojson", "extraction", "ocr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.8,<3",
    "pymupdf>=1.24,<2",
    "python-multipart>=0.0.12,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
airport-ocr = "airport_ocr.cli:main"
airport-ocr-api = "airport_ocr.api.run:main"

[project.urls]
Homepage = "https://github.com/yashpatle23/Airport-OCR"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.setuptools.package-data]
airport_ocr = ["static/*.html", "static/*.css", "static/*.js"]
